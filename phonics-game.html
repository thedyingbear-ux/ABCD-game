<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABCD Phonics Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
body{font-family:'Nunito',sans-serif;background:#FFF8F0;min-height:100vh;display:flex;justify-content:center;padding:1rem;}
#game{width:100%;max-width:520px;}

/* ── START SCREEN ── */
#start-screen{text-align:center;padding:2rem 1rem;display:flex;flex-direction:column;align-items:center;gap:1.2rem;}
.game-title{font-size:52px;font-weight:800;line-height:1;}
.title-a{color:#E24B4A;}.title-b{color:#EF9F27;}.title-c{color:#639922;}.title-d{color:#378ADD;}.title-rest{color:#7F77DD;}
.subtitle{font-size:17px;color:#888780;font-weight:700;}
.mode-cards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;width:100%;margin-top:0.4rem;}
.mode-card{flex:1;min-width:160px;max-width:220px;border:3px solid transparent;border-radius:24px;padding:1.6rem 1rem 1.4rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0.6rem;transition:transform 0.15s;}
.mode-card:hover{transform:scale(1.04);}
.mode-card:active{transform:scale(0.96);}
.mc-trace{background:#EEEDFE;border-color:#7F77DD;}
.mc-drag{background:#E1F5EE;border-color:#1D9E75;}
.mc-icon{font-size:56px;line-height:1;}
.mc-trace h3{font-size:19px;font-weight:800;color:#3C3489;}
.mc-drag h3{font-size:19px;font-weight:800;color:#085041;}
.mc-trace p{font-size:13px;color:#534AB7;text-align:center;}
.mc-drag p{font-size:13px;color:#0F6E56;text-align:center;}
.deco-letters{display:flex;gap:10px;justify-content:center;font-size:36px;font-weight:800;margin-top:0.2rem;}
.dl-a{color:#E24B4A;}.dl-b{color:#EF9F27;}.dl-c{color:#639922;}.dl-d{color:#378ADD;}

/* ── TOP BAR ── */
#main-ui{display:none;}
#top-bar{display:flex;align-items:center;gap:8px;margin-bottom:0.6rem;}
#back-btn{font-size:13px;cursor:pointer;background:#EEEDFE;border:2px solid #7F77DD;border-radius:20px;padding:6px 14px;color:#3C3489;font-weight:800;font-family:inherit;}
#back-btn:hover{background:#CECBF6;}
#round-label{flex:1;text-align:center;font-size:13px;font-weight:700;color:#888780;}
#mute-btn{font-size:22px;cursor:pointer;background:none;border:none;padding:2px 4px;border-radius:8px;}

/* ── SCORE + PROGRESS ── */
#score-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;}
#score-display{font-size:24px;font-weight:800;color:#EF9F27;}
#progress{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;}
.pip{width:11px;height:11px;border-radius:50%;background:#D3D1C7;border:2px solid #B4B2A9;}
.pip.done{background:#639922;border-color:#3B6D11;}
.pip.current{background:#378ADD;border-color:#185FA5;}

/* ── WORD CARD ── */
#word-card{border-radius:24px;padding:1.4rem 1rem;text-align:center;margin-bottom:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.9rem;min-height:170px;border:3px solid;}
.wc-A{background:#FCEBEB;border-color:#F09595;}
.wc-B{background:#FAEEDA;border-color:#FAC775;}
.wc-C{background:#EAF3DE;border-color:#C0DD97;}
.wc-D{background:#E6F1FB;border-color:#85B7EB;}
#picture{font-size:70px;line-height:1;}
#word-display{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;min-height:60px;}
.letter-box{width:50px;height:58px;border-radius:14px;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid;}
.lbx-A{background:#FCEBEB;border-color:#F09595;color:#791F1F;}
.lbx-B{background:#FAEEDA;border-color:#FAC775;color:#633806;}
.lbx-C{background:#EAF3DE;border-color:#C0DD97;color:#27500A;}
.lbx-D{background:#E6F1FB;border-color:#85B7EB;color:#0C447C;}

/* ── DROP ZONE ── */
.drop-zone{width:50px;height:58px;border-radius:14px;font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;border:3px dashed #7F77DD;background:#EEEDFE;color:#534AB7;transition:background 0.12s;}
.drop-zone.drag-over{background:#CECBF6;}
.drop-zone.correct{border:3px solid #639922;background:#EAF3DE;color:#27500A;}
.drop-zone.wrong{border:3px solid #E24B4A;background:#FCEBEB;color:#791F1F;}

/* ── DRAG TILES ── */
#letters-area{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:1rem;}
.letter-tile{width:72px;height:72px;border-radius:18px;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:grab;border:3px solid;touch-action:none;transition:transform 0.1s,opacity 0.15s;}
.letter-tile:active{cursor:grabbing;transform:scale(1.12);}
.letter-tile.dragging{opacity:0.3;}
.letter-tile.used{opacity:0.2;pointer-events:none;}
.lt-A,.lt-a{background:#FCEBEB;border-color:#E24B4A;color:#791F1F;}
.lt-B,.lt-b{background:#FAEEDA;border-color:#EF9F27;color:#633806;}
.lt-C,.lt-c{background:#EAF3DE;border-color:#639922;color:#27500A;}
.lt-D,.lt-d{background:#E6F1FB;border-color:#378ADD;color:#0C447C;}

/* ── LETTER SLOTS (type mode) ── */
.letter-slot{width:50px;height:58px;border-radius:14px;font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;border:3px dashed #7F77DD;background:#EEEDFE;color:#534AB7;}
.letter-slot.filled-correct{border:3px solid #639922;background:#EAF3DE;color:#27500A;}
.letter-slot.filled-wrong{border:3px solid #E24B4A;background:#FCEBEB;color:#791F1F;}
.letter-slot.active-slot{border:3px dashed #378ADD;background:#B5D4F4;color:#0C447C;}

/* ── TRACE ── */
#trace-area{display:flex;flex-direction:column;align-items:center;gap:0.8rem;width:100%;}
.trace-label{font-size:17px;font-weight:700;color:#888780;}
.trace-wrap{position:relative;width:220px;height:220px;border-radius:22px;border:3px solid #AFA9EC;background:#fff;}
#guide-canvas{position:absolute;top:0;left:0;pointer-events:none;border-radius:19px;}
#trace-canvas{position:absolute;top:0;left:0;border-radius:19px;touch-action:none;cursor:crosshair;background:transparent;}
.trace-controls{display:flex;gap:10px;}
.trace-btn{padding:10px 22px;font-size:15px;font-weight:800;font-family:inherit;border-radius:22px;cursor:pointer;border:2px solid;}
.trace-btn.clr{background:#FCEBEB;border-color:#E24B4A;color:#791F1F;}
.trace-btn.clr:hover{background:#F7C1C1;}
.trace-btn.done{background:#E6F1FB;border-color:#378ADD;color:#0C447C;}
.trace-btn.done:hover{background:#B5D4F4;}

/* ── KEYBOARD ── */
#keyboard-area{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-bottom:0.8rem;}
.key-btn{width:52px;height:52px;border-radius:14px;font-size:22px;font-weight:800;font-family:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;border:2px solid;transition:transform 0.08s;}
.key-btn:active{transform:scale(0.88);}
.kc-0{background:#FCEBEB;border-color:#E24B4A;color:#791F1F;}
.kc-1{background:#FAEEDA;border-color:#EF9F27;color:#633806;}
.kc-2{background:#EAF3DE;border-color:#639922;color:#27500A;}
.kc-3{background:#E6F1FB;border-color:#378ADD;color:#0C447C;}
.kc-4{background:#FBEAF0;border-color:#ED93B1;color:#72243E;}
.kc-5{background:#EEEDFE;border-color:#7F77DD;color:#3C3489;}
.kc-del{background:#F1EFE8;border-color:#B4B2A9;color:#444441;font-size:18px;}

/* ── FEEDBACK + NEXT ── */
#feedback{text-align:center;font-size:22px;font-weight:800;min-height:34px;margin-bottom:0.5rem;}
#next-btn{display:block;margin:0 auto;padding:12px 36px;font-size:19px;font-weight:800;font-family:inherit;border-radius:26px;border:3px solid #534AB7;background:#EEEDFE;color:#3C3489;cursor:pointer;visibility:hidden;transition:background 0.12s,transform 0.1s;}
#next-btn:hover{background:#CECBF6;transform:scale(1.04);}

/* ── ROUND BANNER ── */
#round-banner{display:none;flex-direction:column;align-items:center;text-align:center;padding:2.5rem 1rem;gap:1rem;}
.banner-em{font-size:80px;}
#round-banner h2{font-size:26px;font-weight:800;color:#3C3489;}
#round-banner p{font-size:16px;color:#888780;}
#banner-btn{padding:12px 36px;font-size:19px;font-weight:800;font-family:inherit;border-radius:26px;border:3px solid #1D9E75;background:#E1F5EE;color:#085041;cursor:pointer;transition:background 0.12s,transform 0.1s;}
#banner-btn:hover{background:#9FE1CB;transform:scale(1.04);}

/* ── END SCREEN ── */
#end-screen{display:none;text-align:center;padding:2rem 1rem;}
.stars-row{display:flex;gap:8px;justify-content:center;font-size:36px;margin-bottom:0.8rem;}
#end-screen h2{font-size:30px;font-weight:800;margin-bottom:0.4rem;color:#3C3489;}
#end-screen p{font-size:17px;color:#888780;margin-bottom:1.5rem;}
.end-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.end-btns button{padding:12px 28px;font-size:17px;font-weight:800;font-family:inherit;border-radius:26px;cursor:pointer;border:3px solid;transition:transform 0.1s;}
.end-btns button:hover{transform:scale(1.04);}
#play-again-btn{background:#EEEDFE;border-color:#7F77DD;color:#3C3489;}
#menu-btn{background:#E1F5EE;border-color:#1D9E75;color:#085041;}
</style>
</head>
<body>
<div id="game">

  <!-- START SCREEN -->
  <div id="start-screen">
    <div class="game-title">
      <span class="title-a">A</span><span class="title-b">B</span><span class="title-c">C</span><span class="title-d">D</span><span class="title-rest"> Phonics!</span>
    </div>
    <div class="deco-letters">
      <span class="dl-a">🍎</span><span class="dl-b">⚽</span><span class="dl-c">🐱</span><span class="dl-d">🐶</span>
    </div>
    <p class="subtitle">Choose a game to play!</p>
    <div class="mode-cards">
      <div class="mode-card mc-trace" id="pick-trace">
        <div class="mc-icon">✏️</div>
        <h3>Trace &amp; Spell</h3>
        <p>Trace the letter with your finger, then spell the word!</p>
      </div>
      <div class="mode-card mc-drag" id="pick-drag">
        <div class="mc-icon">🎴</div>
        <h3>Drag the Letter</h3>
        <p>Drag the right letter to finish the word!</p>
      </div>
    </div>
  </div>

  <!-- MAIN UI -->
  <div id="main-ui">
    <div id="top-bar">
      <button id="back-btn">← Menu</button>
      <div id="round-label"></div>
      <button id="mute-btn">🔊</button>
    </div>
    <div id="score-bar">
      <div id="score-display">⭐ 0</div>
      <div id="progress"></div>
    </div>
    <div id="word-card" class="wc-A">
      <div id="picture"></div>
      <div id="word-display"></div>
      <div id="trace-area" style="display:none"></div>
    </div>
    <div id="letters-area" style="display:none"></div>
    <div id="keyboard-area" style="display:none"></div>
    <div id="feedback"></div>
    <button id="next-btn">Next ➜</button>

    <!-- ROUND BANNER -->
    <div id="round-banner">
      <div class="banner-em" id="banner-emoji"></div>
      <h2 id="banner-title"></h2>
      <p id="banner-sub"></p>
      <button id="banner-btn">Let's go! ➜</button>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen">
      <div class="stars-row" id="stars-row"></div>
      <h2>Amazing job! 🎉</h2>
      <p id="end-score"></p>
      <div class="end-btns">
        <button id="play-again-btn">Play again</button>
        <button id="menu-btn">Main menu</button>
      </div>
    </div>
  </div>

</div>
<script>
const words=[
  {word:"apple",pic:"🍎",letter:"A"},
  {word:"ant",  pic:"🐜",letter:"A"},
  {word:"ball", pic:"⚽",letter:"B"},
  {word:"bird", pic:"🐦",letter:"B"},
  {word:"cat",  pic:"🐱",letter:"C"},
  {word:"car",  pic:"🚗",letter:"C"},
  {word:"dog",  pic:"🐶",letter:"D"},
  {word:"doll", pic:"🪆",letter:"D"},
];
const TRACE_ROUNDS=[
  {label:"Round 1",name:"Trace the big letter",mode:"trace",upper:true},
  {label:"Round 2",name:"Trace the small letter",mode:"trace",upper:false},
  {label:"Round 3",name:"Spell the word — UPPERCASE",mode:"type",upper:true},
  {label:"Round 4",name:"Spell the word — lowercase",mode:"type",upper:false},
];
const TRACE_BANNERS=[
  {emoji:"🎉",title:"Round 1 done!",sub:"Now let's trace the small letter — a b c d"},
  {emoji:"✏️",title:"Tracing complete!",sub:"Now tap letters to spell the whole word — UPPERCASE!"},
  {emoji:"💪",title:"Almost there!",sub:"Last round — spell the whole word in lowercase!"},
];
const DRAG_ROUNDS=[
  {label:"Round 1",name:"Big letters — drag to the word",mode:"drag",upper:true},
  {label:"Round 2",name:"Small letters — drag to the word",mode:"drag",upper:false},
];
const DRAG_BANNERS=[
  {emoji:"🎉",title:"Round 1 done!",sub:"Now let's try lowercase — a b c d!"},
];
const ALL_UPPER="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const ALL_LOWER=ALL_UPPER.map(c=>c.toLowerCase());
const SIZE=220;
const KEY_COLORS=["kc-0","kc-1","kc-2","kc-3","kc-4","kc-5"];

let audioCtx=null,bgNodes=[],muted=false;
let gameMode="trace",ROUNDS=[],BANNERS=[];
let round=0,order=[],idx=0,score=0,answered=false;
let typedSoFar=[],currentSlot=0;
let traceCanvas,traceCtx,guideCanvas,guideCtx,drawing=false;
let draggedLetter=null,touchTile=null,touchClone=null;

function el(id){return document.getElementById(id);}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

/* ─── AUDIO ─── */
function initAudio(){
  if(audioCtx){audioCtx.resume();return;}
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  audioCtx.resume().then(()=>startBgMusic());
}
function startBgMusic(){
  if(!audioCtx)return;stopBgMusic();
  const mel=[523,659,784,659,523,587,698,784,698,587,523,659,784,880,784,659];
  const nd=0.3,ahead=0.08;
  let melIdx=0,nextNoteTime=audioCtx.currentTime+0.1,timerId=null,running=true;
  const master=audioCtx.createGain();master.gain.value=muted?0:0.06;master.connect(audioCtx.destination);
  function schedule(){
    while(nextNoteTime<audioCtx.currentTime+0.3){
      const f=mel[melIdx%mel.length];
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type="sine";o.frequency.value=f;
      g.gain.setValueAtTime(0,nextNoteTime);
      g.gain.linearRampToValueAtTime(0.9,nextNoteTime+0.04);
      g.gain.linearRampToValueAtTime(0,nextNoteTime+nd-0.02);
      o.connect(g);g.connect(master);
      o.start(nextNoteTime);o.stop(nextNoteTime+nd);
      nextNoteTime+=nd;melIdx++;
      if(melIdx%mel.length===0)nextNoteTime+=0.35;
    }
    if(running)timerId=setTimeout(schedule,80);
  }
  schedule();
  bgNodes=[master,{disconnect:()=>{running=false;clearTimeout(timerId);}}];
}
function stopBgMusic(){bgNodes.forEach(n=>{try{n.disconnect();}catch(e){}});bgNodes=[];}
function toggleMute(){muted=!muted;el("mute-btn").textContent=muted?"🔇":"🔊";if(bgNodes[0])bgNodes[0].gain.value=muted?0:0.06;}
function beep(freq,type,vol,start,dur){
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(0,start);
  g.gain.linearRampToValueAtTime(vol,start+0.02);
  g.gain.linearRampToValueAtTime(0,start+dur-0.01);
  o.connect(g);g.connect(audioCtx.destination);
  o.start(start);o.stop(start+dur);
}
function playSfx(type){
  if(!audioCtx||muted)return;
  if(audioCtx.state==="suspended")audioCtx.resume();
  const t=audioCtx.currentTime+0.01;
  if(type==="correct"){
    [[523,"triangle",.5,0],[659,"triangle",.5,.12],[784,"triangle",.5,.24],[1047,"triangle",.6,.38]].forEach(([f,w,v,dt])=>beep(f,w,v,t+dt,.22));
  } else if(type==="wrong"){
    beep(280,"sawtooth",.5,t,.18);
    beep(220,"sawtooth",.4,t+.19,.18);
  } else if(type==="fanfare"){
    [[523,"triangle",.5,0],[659,"triangle",.5,.12],[784,"triangle",.5,.24],[659,"triangle",.5,.38],[784,"triangle",.5,.5],[1047,"triangle",.7,.64]].forEach(([f,w,v,dt])=>beep(f,w,v,t+dt,.28));
  } else if(type==="tap"){
    beep(900,"sine",.4,t,.09);
  }
}

/* ─── GUIDE PATHS ─── */
const GUIDE_PATHS={
  A:(ctx,s)=>{ctx.moveTo(s*.5,s*.1);ctx.lineTo(s*.85,s*.9);ctx.moveTo(s*.15,s*.9);ctx.lineTo(s*.5,s*.1);ctx.moveTo(s*.28,s*.58);ctx.lineTo(s*.72,s*.58);},
  B:(ctx,s)=>{ctx.moveTo(s*.22,s*.1);ctx.lineTo(s*.22,s*.9);ctx.moveTo(s*.22,s*.1);ctx.bezierCurveTo(s*.78,s*.1,s*.78,s*.5,s*.22,s*.5);ctx.moveTo(s*.22,s*.5);ctx.bezierCurveTo(s*.82,s*.5,s*.82,s*.9,s*.22,s*.9);},
  C:(ctx,s)=>{ctx.arc(s*.5,s*.5,s*.38,Math.PI*.22,Math.PI*1.78);},
  D:(ctx,s)=>{ctx.moveTo(s*.25,s*.1);ctx.lineTo(s*.25,s*.9);ctx.moveTo(s*.25,s*.1);ctx.bezierCurveTo(s*.9,s*.1,s*.9,s*.9,s*.25,s*.9);},
  a:(ctx,s)=>{ctx.arc(s*.44,s*.63,s*.27,Math.PI*.08,Math.PI*1.92);ctx.moveTo(s*.71,s*.36);ctx.lineTo(s*.71,s*.9);},
  b:(ctx,s)=>{ctx.moveTo(s*.24,s*.1);ctx.lineTo(s*.24,s*.9);ctx.arc(s*.48,s*.66,s*.26,Math.PI,Math.PI*3);},
  c:(ctx,s)=>{ctx.arc(s*.5,s*.64,s*.26,Math.PI*.18,Math.PI*1.82);},
  d:(ctx,s)=>{ctx.moveTo(s*.73,s*.1);ctx.lineTo(s*.73,s*.9);ctx.arc(s*.49,s*.66,s*.26,0,Math.PI*2);},
};
const START_PTS={A:{x:.5,y:.1},B:{x:.22,y:.1},C:{x:.78,y:.22},D:{x:.25,y:.1},a:{x:.71,y:.36},b:{x:.24,y:.1},c:{x:.76,y:.42},d:{x:.73,y:.1}};
const GUIDE_COLORS={A:"#E24B4A",B:"#EF9F27",C:"#639922",D:"#378ADD",a:"#E24B4A",b:"#EF9F27",c:"#639922",d:"#378ADD"};

function sampleGuidePath(letter){
  const tmp=document.createElement("canvas");tmp.width=SIZE;tmp.height=SIZE;
  const ctx=tmp.getContext("2d");ctx.beginPath();GUIDE_PATHS[letter](ctx,SIZE);
  ctx.strokeStyle="#000";ctx.lineWidth=18;ctx.lineCap="round";ctx.lineJoin="round";ctx.stroke();
  const data=ctx.getImageData(0,0,SIZE,SIZE).data,pts=[];
  for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++)if(data[(y*SIZE+x)*4+3]>50)pts.push({x,y});
  return pts;
}
function scoreTracing(letter){
  const imgData=traceCtx.getImageData(0,0,SIZE,SIZE).data,userPts=[];
  for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++)if(imgData[(y*SIZE+x)*4+3]>30)userPts.push({x,y});
  if(userPts.length<80)return{ok:false,reason:"not_enough"};
  const guidePts=sampleGuidePath(letter);
  const CELL=18;
  const gSet=new Set(guidePts.map(p=>`${Math.floor(p.x/CELL)},${Math.floor(p.y/CELL)}`));
  const uSet=new Set(userPts.map(p=>`${Math.floor(p.x/CELL)},${Math.floor(p.y/CELL)}`));
  let on=0;uSet.forEach(k=>{if(gSet.has(k))on++;});
  let gh=0;gSet.forEach(k=>{if(uSet.has(k))gh++;});
  return{ok:on/uSet.size>=0.45&&gh/gSet.size>=0.35};
}
function drawGuide(letter){
  const col=GUIDE_COLORS[letter]||"#7F77DD";
  guideCtx.clearRect(0,0,SIZE,SIZE);
  guideCtx.save();
  guideCtx.setLineDash([14,10]);
  guideCtx.strokeStyle=col+"66";
  guideCtx.lineWidth=20;guideCtx.lineCap="round";guideCtx.lineJoin="round";
  guideCtx.beginPath();GUIDE_PATHS[letter](guideCtx,SIZE);guideCtx.stroke();
  guideCtx.restore();
  const sp=START_PTS[letter];
  if(sp){
    guideCtx.save();guideCtx.fillStyle=col;guideCtx.beginPath();
    guideCtx.arc(sp.x*SIZE,sp.y*SIZE,11,0,Math.PI*2);guideCtx.fill();
    guideCtx.fillStyle="#fff";guideCtx.font="bold 11px sans-serif";
    guideCtx.textAlign="center";guideCtx.textBaseline="middle";
    guideCtx.fillText("1",sp.x*SIZE,sp.y*SIZE);guideCtx.restore();
  }
}

/* ─── CARD COLOR ─── */
function setCardColor(letter){
  const wc=el("word-card");
  wc.className="wc-"+letter.toUpperCase();
}

/* ─── NAVIGATION ─── */
function goToMenu(){
  stopBgMusic();
  el("main-ui").style.display="none";
  el("start-screen").style.display="flex";
  el("round-banner").style.display="none";
  el("end-screen").style.display="none";
}

function startGame(mode){
  gameMode=mode;
  ROUNDS=mode==="trace"?TRACE_ROUNDS:DRAG_ROUNDS;
  BANNERS=mode==="trace"?TRACE_BANNERS:DRAG_BANNERS;
  initAudio();round=0;score=0;
  el("start-screen").style.display="none";
  el("main-ui").style.display="block";
  el("end-screen").style.display="none";
  el("round-banner").style.display="none";
  showUI(true);startRound();
}

function startRound(){
  order=shuffle([...Array(words.length).keys()]);
  idx=0;answered=false;
  el("round-label").textContent=ROUNDS[round].label+" — "+ROUNDS[round].name;
  el("feedback").textContent="";
  el("next-btn").style.visibility="hidden";
  buildProgress();loadQ();
}

function getTotal(){return gameMode==="trace"?words.length*TRACE_ROUNDS.length:words.length*DRAG_ROUNDS.length;}

function buildProgress(){
  const p=el("progress");p.innerHTML="";
  for(let i=0;i<getTotal();i++){
    const d=document.createElement("div");
    d.className="pip"+(i<round*words.length?"done":i===round*words.length+idx?"current":"");
    d.id="pip"+i;p.appendChild(d);
  }
}
function updateProgress(){
  for(let i=0;i<getTotal();i++){
    const e=el("pip"+i);if(!e)continue;
    const off=round*words.length;
    e.className="pip"+(i<off?"done":i===off+idx?"current":i<off+idx?"done":"");
  }
}

function loadQ(){
  answered=false;typedSoFar=[];currentSlot=0;draggedLetter=null;
  const w=words[order[idx]],r=ROUNDS[round];
  el("picture").textContent="";el("feedback").textContent="";el("next-btn").style.visibility="hidden";
  el("letters-area").style.display="none";
  el("trace-area").style.display="none";
  el("keyboard-area").style.display="none";
  el("word-display").style.display="none";
  setCardColor(w.letter);
  updateProgress();
  if(r.mode==="trace"){
    el("trace-area").style.display="flex";
    buildTraceUI(r.upper?w.letter:w.letter.toLowerCase());
  } else if(r.mode==="drag"){
    el("word-display").style.display="flex";
    el("letters-area").style.display="flex";
    el("picture").textContent=w.pic;
    buildWordDisplayDrag(w,r);
    buildDragTiles(r.upper);
  } else {
    el("word-display").style.display="flex";
    el("keyboard-area").style.display="flex";
    el("picture").textContent=w.pic;
    buildWordDisplayType(w,r);
    buildKeyboard(r.upper);
  }
}

/* ─── TRACE UI ─── */
function buildTraceUI(letter){
  const ta=el("trace-area");ta.innerHTML="";
  const lbl=document.createElement("div");lbl.className="trace-label";lbl.textContent="Trace the letter:";ta.appendChild(lbl);
  const wrap=document.createElement("div");wrap.className="trace-wrap";
  guideCanvas=document.createElement("canvas");guideCanvas.id="guide-canvas";guideCanvas.width=SIZE;guideCanvas.height=SIZE;
  traceCanvas=document.createElement("canvas");traceCanvas.id="trace-canvas";traceCanvas.width=SIZE;traceCanvas.height=SIZE;
  wrap.appendChild(guideCanvas);wrap.appendChild(traceCanvas);ta.appendChild(wrap);
  guideCtx=guideCanvas.getContext("2d");drawGuide(letter);
  traceCtx=traceCanvas.getContext("2d");
  const col=GUIDE_COLORS[letter]||"#3C3489";
  traceCtx.strokeStyle=col;traceCtx.lineWidth=8;traceCtx.lineCap="round";traceCtx.lineJoin="round";
  const controls=document.createElement("div");controls.className="trace-controls";
  const clr=document.createElement("button");clr.className="trace-btn clr";clr.textContent="Clear ✕";
  clr.addEventListener("click",()=>{traceCtx.clearRect(0,0,SIZE,SIZE);el("feedback").textContent="";});
  const done=document.createElement("button");done.className="trace-btn done";done.textContent="Done ✓";
  done.addEventListener("click",()=>handleTraceDone(letter));
  controls.appendChild(clr);controls.appendChild(done);ta.appendChild(controls);
  function getPos(e,c){const r=c.getBoundingClientRect();const src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left)*(c.width/r.width),y:(src.clientY-r.top)*(c.height/r.height)};}
  traceCanvas.addEventListener("mousedown",e=>{drawing=true;traceCtx.beginPath();const p=getPos(e,traceCanvas);traceCtx.moveTo(p.x,p.y);});
  traceCanvas.addEventListener("mousemove",e=>{if(!drawing)return;const p=getPos(e,traceCanvas);traceCtx.lineTo(p.x,p.y);traceCtx.stroke();});
  traceCanvas.addEventListener("mouseup",()=>drawing=false);
  traceCanvas.addEventListener("touchstart",e=>{e.preventDefault();drawing=true;traceCtx.beginPath();const p=getPos(e,traceCanvas);traceCtx.moveTo(p.x,p.y);},{passive:false});
  traceCanvas.addEventListener("touchmove",e=>{e.preventDefault();if(!drawing)return;const p=getPos(e,traceCanvas);traceCtx.lineTo(p.x,p.y);traceCtx.stroke();},{passive:false});
  traceCanvas.addEventListener("touchend",()=>drawing=false);
}
function handleTraceDone(letter){
  if(answered)return;
  const result=scoreTracing(letter);
  if(result.reason==="not_enough"){el("feedback").textContent="Draw more of the letter! ✏️";playSfx("wrong");return;}
  if(!result.ok){el("feedback").textContent="Try to follow the dotted guide! ✏️";playSfx("wrong");return;}
  answered=true;score++;
  el("score-display").textContent="⭐ "+score;
  el("feedback").textContent="⭐ Great tracing!";
  playSfx("correct");
  setTimeout(()=>{el("next-btn").style.visibility="visible";},500);
}

/* ─── DRAG UI ─── */
function buildWordDisplayDrag(w,r){
  const wd=el("word-display");wd.innerHTML="";
  const dw=r.upper?w.word.toUpperCase():w.word;
  dw.split("").forEach((ch,i)=>{
    if(i===0){
      const dz=document.createElement("div");dz.className="drop-zone";dz.id="drop-zone";dz.textContent="_";
      dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("drag-over");});
      dz.addEventListener("dragleave",()=>dz.classList.remove("drag-over"));
      dz.addEventListener("drop",e=>{e.preventDefault();handleDrop(draggedLetter);});
      wd.appendChild(dz);
    } else {
      const lb=document.createElement("div");
      lb.className="letter-box lbx-"+w.letter;
      lb.textContent=ch;wd.appendChild(lb);
    }
  });
}
function buildDragTiles(upper){
  const area=el("letters-area");area.innerHTML="";
  const opts=shuffle(upper?["A","B","C","D"]:["a","b","c","d"]);
  opts.forEach(ch=>{
    const tile=document.createElement("div");
    tile.className="letter-tile lt-"+ch;
    tile.textContent=ch;tile.draggable=true;tile.dataset.letter=ch;
    tile.addEventListener("dragstart",()=>{draggedLetter=ch;setTimeout(()=>tile.classList.add("dragging"),0);});
    tile.addEventListener("dragend",()=>tile.classList.remove("dragging"));
    tile.addEventListener("touchstart",e=>onTouchStart(e,tile,ch),{passive:false});
    tile.addEventListener("touchmove",onTouchMove,{passive:false});
    tile.addEventListener("touchend",e=>onTouchEnd(e,ch));
    area.appendChild(tile);
  });
}
function handleDrop(letter){
  if(answered||!letter)return;
  const dz=el("drop-zone");if(!dz)return;
  const w=words[order[idx]],r=ROUNDS[round];
  const correct=r.upper?w.letter:w.letter.toLowerCase();
  answered=true;dz.textContent=letter;dz.classList.remove("drag-over");
  document.querySelectorAll(".letter-tile").forEach(t=>{if(t.dataset.letter===letter)t.classList.add("used");});
  if(letter===correct){
    dz.classList.add("correct");el("feedback").textContent="⭐ Great job!";
    score++;el("score-display").textContent="⭐ "+score;playSfx("correct");
  } else {
    dz.classList.add("wrong");el("feedback").textContent='Nice try! It\'s "'+correct+'"';playSfx("wrong");
  }
  setTimeout(()=>{el("next-btn").style.visibility="visible";},600);
}

/* ─── TOUCH DRAG ─── */
function onTouchStart(e,tile,ch){
  e.preventDefault();touchTile=tile;
  const t=e.touches[0];
  touchClone=tile.cloneNode(true);
  touchClone.style.cssText="position:fixed;opacity:0.88;pointer-events:none;z-index:9999;width:72px;height:72px;font-size:40px;font-weight:800;font-family:'Nunito',sans-serif;display:flex;align-items:center;justify-content:center;border-radius:18px;border:3px solid;";
  const colMap={A:"background:#FCEBEB;border-color:#E24B4A;color:#791F1F;",B:"background:#FAEEDA;border-color:#EF9F27;color:#633806;",C:"background:#EAF3DE;border-color:#639922;color:#27500A;",D:"background:#E6F1FB;border-color:#378ADD;color:#0C447C;",a:"background:#FCEBEB;border-color:#E24B4A;color:#791F1F;",b:"background:#FAEEDA;border-color:#EF9F27;color:#633806;",c:"background:#EAF3DE;border-color:#639922;color:#27500A;",d:"background:#E6F1FB;border-color:#378ADD;color:#0C447C;"};
  touchClone.style.cssText+=colMap[ch]||"background:#EEEDFE;border-color:#7F77DD;color:#3C3489;";
  touchClone.textContent=ch;
  touchClone.style.left=(t.clientX-36)+"px";touchClone.style.top=(t.clientY-36)+"px";
  document.body.appendChild(touchClone);tile.classList.add("dragging");
}
function onTouchMove(e){
  e.preventDefault();if(!touchClone)return;
  const t=e.touches[0];touchClone.style.left=(t.clientX-36)+"px";touchClone.style.top=(t.clientY-36)+"px";
}
function onTouchEnd(e,ch){
  if(!touchClone)return;
  const t=e.changedTouches[0];const dz=el("drop-zone");
  if(dz){const r=dz.getBoundingClientRect();if(t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom)handleDrop(ch);}
  touchClone.remove();touchClone=null;if(touchTile){touchTile.classList.remove("dragging");touchTile=null;}
}

/* ─── TYPE / KEYBOARD ─── */
function buildWordDisplayType(w,r){
  const wd=el("word-display");wd.innerHTML="";
  const dw=r.upper?w.word.toUpperCase():w.word;
  dw.split("").forEach((ch,i)=>{
    const s=document.createElement("div");s.className="letter-slot"+(i===0?" active-slot":"");s.id="slot"+i;wd.appendChild(s);
  });
}
function buildKeyboard(upper){
  const ka=el("keyboard-area");ka.innerHTML="";
  (upper?ALL_UPPER:ALL_LOWER).forEach((ch,i)=>{
    const btn=document.createElement("div");
    btn.className="key-btn "+KEY_COLORS[i%KEY_COLORS.length];
    btn.textContent=ch;
    btn.addEventListener("click",()=>{playSfx("tap");handleKey(ch);});
    ka.appendChild(btn);
  });
  const del=document.createElement("div");del.className="key-btn kc-del";del.textContent="⌫";
  del.addEventListener("click",handleDelete);ka.appendChild(del);
}
function handleKey(ch){
  if(answered)return;
  const w=words[order[idx]],r=ROUNDS[round];
  const target=r.upper?w.word.toUpperCase():w.word;
  if(currentSlot>=target.length)return;
  const slot=el("slot"+currentSlot);if(!slot)return;
  slot.textContent=ch;slot.classList.remove("active-slot");
  const ok=ch===target[currentSlot];slot.classList.add(ok?"filled-correct":"filled-wrong");
  typedSoFar.push({ch,correct:ok});currentSlot++;
  if(currentSlot<target.length){const nx=el("slot"+currentSlot);if(nx)nx.classList.add("active-slot");}
  if(currentSlot===target.length){
    answered=true;
    const all=typedSoFar.every(t=>t.correct);
    if(all){score++;el("score-display").textContent="⭐ "+score;el("feedback").textContent="⭐ Perfect spelling!";playSfx("correct");}
    else{el("feedback").textContent="Good try! Check the red letters.";playSfx("wrong");}
    setTimeout(()=>{el("next-btn").style.visibility="visible";},600);
  }
}
function handleDelete(){
  if(answered||currentSlot===0)return;
  currentSlot--;
  const slot=el("slot"+currentSlot);if(!slot)return;
  slot.textContent="";slot.className="letter-slot active-slot";typedSoFar.pop();
  const nx=el("slot"+(currentSlot+1));if(nx)nx.classList.remove("active-slot");
}

/* ─── FLOW ─── */
el("next-btn").addEventListener("click",()=>{
  idx++;
  if(idx>=words.length){round<ROUNDS.length-1?showBanner():showEnd();return;}
  loadQ();
});
function showBanner(){
  showUI(false);el("round-label").textContent="";
  const b=BANNERS[round];
  el("banner-emoji").textContent=b.emoji;el("banner-title").textContent=b.title;el("banner-sub").textContent=b.sub;
  el("round-banner").style.display="flex";playSfx("fanfare");
}
el("banner-btn").addEventListener("click",()=>{el("round-banner").style.display="none";round++;showUI(true);startRound();});
function showUI(v){
  ["word-card","feedback","next-btn"].forEach(id=>{el(id).style.display=v?(id==="word-card"?"flex":""):"none";});
  if(!v){el("trace-area").style.display="none";el("keyboard-area").style.display="none";el("letters-area").style.display="none";}
}
function showEnd(){
  showUI(false);el("round-label").textContent="";
  const total=getTotal();
  const pct=score/total;
  const stars=pct>=0.9?"⭐⭐⭐":pct>=0.6?"⭐⭐":"⭐";
  el("stars-row").textContent=stars;
  el("end-score").textContent="You got "+score+" out of "+total+" right!";
  el("end-screen").style.display="block";playSfx("fanfare");
}
el("pick-trace").addEventListener("click",()=>startGame("trace"));
el("pick-drag").addEventListener("click",()=>startGame("drag"));
el("play-again-btn").addEventListener("click",()=>{el("end-screen").style.display="none";startGame(gameMode);});
el("menu-btn").addEventListener("click",goToMenu);
el("back-btn").addEventListener("click",goToMenu);
el("mute-btn").addEventListener("click",toggleMute);
</script>
</body>
