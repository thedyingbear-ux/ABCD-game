
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
#game { padding: 1rem; max-width: 680px; font-family: var(--font-sans); }
#start-screen { text-align: center; padding: 2rem 1rem; display: flex; flex-direction: column; align-items: center; gap: 1.2rem; }
#start-screen h2 { font-size: 26px; font-weight: 500; color: var(--color-text-primary); }
#start-screen p { font-size: 15px; color: var(--color-text-secondary); }
.mode-cards { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; width: 100%; }
.mode-card { flex: 1; min-width: 180px; max-width: 240px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-lg); padding: 1.4rem 1rem; cursor: pointer; background: var(--color-background-primary); display: flex; flex-direction: column; align-items: center; gap: 0.6rem; transition: background 0.15s, border-color 0.15s; }
.mode-card:hover { background: var(--color-background-secondary); border-color: var(--color-border-primary); }
.mode-card:active { transform: scale(0.97); }
.mode-card .mc-icon { font-size: 52px; line-height: 1; }
.mode-card h3 { font-size: 17px; font-weight: 500; color: var(--color-text-primary); }
.mode-card p { font-size: 13px; color: var(--color-text-secondary); text-align: center; }
#round-label { text-align: center; font-size: 13px; color: var(--color-text-secondary); margin-bottom: 0.4rem; letter-spacing: 0.04em; }
#score-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
#score-display { font-size: 20px; font-weight: 500; color: var(--color-text-primary); }
#mute-btn { font-size: 22px; cursor: pointer; background: none; border: none; padding: 2px 6px; border-radius: 6px; }
#mute-btn:hover { background: var(--color-background-secondary); }
#back-btn { font-size: 13px; cursor: pointer; background: none; border: 0.5px solid var(--color-border-secondary); border-radius: 6px; padding: 4px 10px; color: var(--color-text-secondary); }
#back-btn:hover { background: var(--color-background-secondary); }
#progress { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.pip { width: 8px; height: 8px; border-radius: 50%; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-secondary); }
.pip.done { background: #639922; border-color: #3B6D11; }
.pip.current { background: #378ADD; border-color: #185FA5; }
#word-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.2rem 1rem; text-align: center; margin-bottom: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.8rem; min-height: 160px; }
#picture { font-size: 60px; line-height: 1; }
#word-display { display: flex; align-items: center; justify-content: center; gap: 5px; flex-wrap: wrap; min-height: 54px; }
.letter-box { width: 46px; height: 54px; border-radius: var(--border-radius-md); font-size: 28px; font-weight: 500; display: flex; align-items: center; justify-content: center; border: 0.5px solid var(--color-border-tertiary); background: var(--color-background-secondary); color: var(--color-text-primary); }
.drop-zone { width: 46px; height: 54px; border-radius: var(--border-radius-md); font-size: 28px; font-weight: 500; display: flex; align-items: center; justify-content: center; border: 2px dashed #378ADD; background: #E6F1FB; color: #185FA5; transition: background 0.12s; }
.drop-zone.drag-over { background: #B5D4F4; }
.drop-zone.correct { border: 2px solid #639922; background: #EAF3DE; color: #3B6D11; }
.drop-zone.wrong { border: 2px solid #E24B4A; background: #FCEBEB; color: #A32D2D; }
#letters-area { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 1rem; }
.letter-tile { width: 64px; height: 64px; border-radius: var(--border-radius-md); font-size: 36px; font-weight: 500; display: flex; align-items: center; justify-content: center; cursor: grab; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); transition: transform 0.1s, opacity 0.15s; touch-action: none; }
.letter-tile:active { cursor: grabbing; transform: scale(1.1); }
.letter-tile.dragging { opacity: 0.3; }
.letter-tile.used { opacity: 0.2; pointer-events: none; }
.letter-slot { width: 46px; height: 54px; border-radius: var(--border-radius-md); font-size: 28px; font-weight: 500; display: flex; align-items: center; justify-content: center; border: 2px dashed #378ADD; background: #E6F1FB; color: #185FA5; }
.letter-slot.filled-correct { border: 2px solid #639922; background: #EAF3DE; color: #3B6D11; }
.letter-slot.filled-wrong { border: 2px solid #E24B4A; background: #FCEBEB; color: #A32D2D; }
.letter-slot.active-slot { border: 2px dashed #378ADD; background: #B5D4F4; }
#trace-area { display: flex; flex-direction: column; align-items: center; gap: 0.7rem; width: 100%; }
.trace-wrap { position: relative; width: 220px; height: 220px; border-radius: 12px; border: 0.5px solid var(--color-border-tertiary); background: #fff; }
#guide-canvas { position: absolute; top: 0; left: 0; pointer-events: none; border-radius: 12px; }
#trace-canvas { position: absolute; top: 0; left: 0; border-radius: 12px; touch-action: none; cursor: crosshair; background: transparent; }
.trace-controls { display: flex; gap: 8px; }
.trace-btn { padding: 8px 18px; font-size: 15px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; }
.trace-btn:hover { background: var(--color-background-secondary); }
#keyboard-area { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 0.8rem; }
.key-btn { width: 54px; height: 54px; border-radius: var(--border-radius-md); font-size: 24px; font-weight: 500; display: flex; align-items: center; justify-content: center; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; touch-action: manipulation; }
.key-btn:active { transform: scale(0.93); background: var(--color-background-secondary); }
.key-btn.del { font-size: 18px; background: var(--color-background-secondary); }
#feedback { text-align: center; font-size: 20px; font-weight: 500; min-height: 32px; margin-bottom: 0.5rem; color: var(--color-text-primary); }
#next-btn { display: block; margin: 0 auto; padding: 9px 28px; font-size: 17px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; visibility: hidden; }
#next-btn:hover { background: var(--color-background-secondary); }
#round-banner { display: none; flex-direction: column; align-items: center; text-align: center; padding: 2rem 1rem; gap: 0.8rem; }
#round-banner .bem { font-size: 60px; }
#round-banner h2 { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
#round-banner p { font-size: 15px; color: var(--color-text-secondary); }
#banner-btn { padding: 9px 28px; font-size: 17px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; }
#banner-btn:hover { background: var(--color-background-secondary); }
#end-screen { display: none; text-align: center; padding: 2rem 1rem; }
#end-screen h2 { font-size: 26px; font-weight: 500; margin-bottom: 0.5rem; color: var(--color-text-primary); }
#end-screen p { font-size: 15px; color: var(--color-text-secondary); margin-bottom: 1.5rem; }
.end-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.end-btns button { padding: 9px 22px; font-size: 16px; border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); color: var(--color-text-primary); cursor: pointer; }
.end-btns button:hover { background: var(--color-background-secondary); }
</style>

<script>
const words=[
  {word:"apple",pic:"🍎",letter:"A"},
  {word:"ant",  pic:"🐜",letter:"A"},
  {word:"ball", pic:"⚽",letter:"B"},
  {word:"bird", pic:"🐦",letter:"B"},
  {word:"cat",  pic:"🐱",letter:"C"},
  {word:"car",  pic:"🚗",letter:"C"},
  {word:"dog",  pic:"🐶",letter:"D"},
  {word:"doll", pic:"🪆",letter:"D"},
];

const TRACE_ROUNDS=[
  {label:"Round 1",name:"Trace the big letter",mode:"trace",upper:true},
  {label:"Round 2",name:"Trace the small letter",mode:"trace",upper:false},
  {label:"Round 3",name:"Spell it — UPPERCASE",mode:"type",upper:true},
  {label:"Round 4",name:"Spell it — lowercase",mode:"type",upper:false},
];
const TRACE_BANNERS=[
  {emoji:"🎉",title:"Round 1 done!",sub:"Now trace the small letter — a b c d"},
  {emoji:"✏️",title:"Tracing complete!",sub:"Now tap letters to spell the whole word — UPPERCASE!"},
  {emoji:"💪",title:"Almost there!",sub:"Last round — spell the whole word in lowercase!"},
];
const DRAG_ROUNDS=[
  {label:"Round 1",name:"Big letters — drag to complete",mode:"drag",upper:true},
  {label:"Round 2",name:"Small letters — drag to complete",mode:"drag",upper:false},
];
const DRAG_BANNERS=[
  {emoji:"🎉",title:"Round 1 done!",sub:"Now let's try lowercase letters — a b c d"},
];

const ALL_UPPER="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const ALL_LOWER=ALL_UPPER.map(c=>c.toLowerCase());
const SIZE=220;

let audioCtx=null,bgNodes=[],muted=false;
let gameMode="trace";
let ROUNDS=[],BANNERS=[];
let round=0,order=[],idx=0,score=0,answered=false;
let typedSoFar=[],currentSlot=0;
let traceCanvas,traceCtx,guideCanvas,guideCtx,drawing=false;
let draggedLetter=null,touchTile=null,touchClone=null;

function el(id){return document.getElementById(id);}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function initAudio(){
  if(audioCtx)return;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  startBgMusic();
}
function startBgMusic(){
  if(!audioCtx)return; stopBgMusic();
  const mel=[523,659,784,659,523,587,698,784,698,587,523,659,784,880,784,659];
  const master=audioCtx.createGain(); master.gain.value=muted?0:0.07; master.connect(audioCtx.destination); bgNodes=[master];
  let t=audioCtx.currentTime+0.1; const nd=0.32;
  function loop(){mel.forEach(f=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+0.04);g.gain.linearRampToValueAtTime(0,t+nd-0.02);o.connect(g);g.connect(master);o.start(t);o.stop(t+nd);t+=nd;});t+=0.4;}
  for(let i=0;i<999;i++)loop();
}
function stopBgMusic(){bgNodes.forEach(n=>{try{n.disconnect();}catch(e){}});bgNodes=[];}
function toggleMute(){muted=!muted;el("mute-btn").textContent=muted?"🔇":"🔊";if(bgNodes[0])bgNodes[0].gain.value=muted?0:0.07;}
function playSfx(type){
  if(!audioCtx||muted)return;
  const t=audioCtx.currentTime;
  if(type==="correct"){[[523,0],[659,.1],[784,.2],[1047,.32]].forEach(([f,dt])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,t+dt);g.gain.linearRampToValueAtTime(.3,t+dt+.03);g.gain.linearRampToValueAtTime(0,t+dt+.18);o.connect(g);g.connect(audioCtx.destination);o.start(t+dt);o.stop(t+dt+.2);});}
  else if(type==="wrong"){[[300,0],[250,.15]].forEach(([f,dt])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sawtooth";o.frequency.value=f;g.gain.setValueAtTime(0,t+dt);g.gain.linearRampToValueAtTime(.2,t+dt+.02);g.gain.linearRampToValueAtTime(0,t+dt+.15);o.connect(g);g.connect(audioCtx.destination);o.start(t+dt);o.stop(t+dt+.18);});}
  else if(type==="fanfare"){[[523,0],[659,.1],[784,.2],[659,.32],[784,.44],[1047,.56]].forEach(([f,dt])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,t+dt);g.gain.linearRampToValueAtTime(.35,t+dt+.04);g.gain.linearRampToValueAtTime(0,t+dt+.25);o.connect(g);g.connect(audioCtx.destination);o.start(t+dt);o.stop(t+dt+.28);});}
  else if(type==="tap"){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=880;g.gain.setValueAtTime(.15,t);g.gain.linearRampToValueAtTime(0,t+.08);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.1);}
}

const GUIDE_PATHS={
  A:(ctx,s)=>{ctx.moveTo(s*.5,s*.1);ctx.lineTo(s*.85,s*.9);ctx.moveTo(s*.15,s*.9);ctx.lineTo(s*.5,s*.1);ctx.moveTo(s*.28,s*.58);ctx.lineTo(s*.72,s*.58);},
  B:(ctx,s)=>{ctx.moveTo(s*.22,s*.1);ctx.lineTo(s*.22,s*.9);ctx.moveTo(s*.22,s*.1);ctx.bezierCurveTo(s*.78,s*.1,s*.78,s*.5,s*.22,s*.5);ctx.moveTo(s*.22,s*.5);ctx.bezierCurveTo(s*.82,s*.5,s*.82,s*.9,s*.22,s*.9);},
  C:(ctx,s)=>{ctx.arc(s*.5,s*.5,s*.38,Math.PI*.22,Math.PI*1.78);},
  D:(ctx,s)=>{ctx.moveTo(s*.25,s*.1);ctx.lineTo(s*.25,s*.9);ctx.moveTo(s*.25,s*.1);ctx.bezierCurveTo(s*.9,s*.1,s*.9,s*.9,s*.25,s*.9);},
  a:(ctx,s)=>{ctx.arc(s*.44,s*.63,s*.27,Math.PI*.08,Math.PI*1.92);ctx.moveTo(s*.71,s*.36);ctx.lineTo(s*.71,s*.9);},
  b:(ctx,s)=>{ctx.moveTo(s*.24,s*.1);ctx.lineTo(s*.24,s*.9);ctx.arc(s*.48,s*.66,s*.26,Math.PI,Math.PI*3);},
  c:(ctx,s)=>{ctx.arc(s*.5,s*.64,s*.26,Math.PI*.18,Math.PI*1.82);},
  d:(ctx,s)=>{ctx.moveTo(s*.73,s*.1);ctx.lineTo(s*.73,s*.9);ctx.arc(s*.49,s*.66,s*.26,0,Math.PI*2);},
};
const START_PTS={A:{x:.5,y:.1},B:{x:.22,y:.1},C:{x:.78,y:.22},D:{x:.25,y:.1},a:{x:.71,y:.36},b:{x:.24,y:.1},c:{x:.76,y:.42},d:{x:.73,y:.1}};

function sampleGuidePath(letter){
  const tmp=document.createElement("canvas");tmp.width=SIZE;tmp.height=SIZE;
  const ctx=tmp.getContext("2d");ctx.beginPath();GUIDE_PATHS[letter](ctx,SIZE);
  ctx.strokeStyle="#000";ctx.lineWidth=18;ctx.lineCap="round";ctx.lineJoin="round";ctx.stroke();
  const data=ctx.getImageData(0,0,SIZE,SIZE).data,pts=[];
  for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++)if(data[(y*SIZE+x)*4+3]>50)pts.push({x,y});
  return pts;
}
function scoreTracing(letter){
  const imgData=traceCtx.getImageData(0,0,SIZE,SIZE).data,userPts=[];
  for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++)if(imgData[(y*SIZE+x)*4+3]>30)userPts.push({x,y});
  if(userPts.length<80)return{ok:false,reason:"not_enough"};
  const guidePts=sampleGuidePath(letter);
  const CELL=18;
  const guideSet=new Set(guidePts.map(p=>`${Math.floor(p.x/CELL)},${Math.floor(p.y/CELL)}`));
  const userSet=new Set(userPts.map(p=>`${Math.floor(p.x/CELL)},${Math.floor(p.y/CELL)}`));
  let onGuide=0;userSet.forEach(k=>{if(guideSet.has(k))onGuide++;});
  let guideHit=0;guideSet.forEach(k=>{if(userSet.has(k))guideHit++;});
  return{ok:onGuide/userSet.size>=0.45&&guideHit/guideSet.size>=0.35};
}
function drawGuide(letter){
  guideCtx.clearRect(0,0,SIZE,SIZE);
  guideCtx.save();guideCtx.setLineDash([12,9]);guideCtx.strokeStyle="#93C5FD";guideCtx.lineWidth=16;guideCtx.lineCap="round";guideCtx.lineJoin="round";
  guideCtx.beginPath();GUIDE_PATHS[letter](guideCtx,SIZE);guideCtx.stroke();guideCtx.restore();
  const sp=START_PTS[letter];
  if(sp){guideCtx.save();guideCtx.fillStyle="#378ADD";guideCtx.beginPath();guideCtx.arc(sp.x*SIZE,sp.y*SIZE,9,0,Math.PI*2);guideCtx.fill();guideCtx.fillStyle="#fff";guideCtx.font="bold 10px sans-serif";guideCtx.textAlign="center";guideCtx.textBaseline="middle";guideCtx.fillText("1",sp.x*SIZE,sp.y*SIZE);guideCtx.restore();}
}

function goToMenu(){
  stopBgMusic();
  el("main-ui").style.display="none";
  el("start-screen").style.display="flex";
  el("round-banner").style.display="none";
  el("end-screen").style.display="none";
}

function startGame(mode){
  gameMode=mode;
  ROUNDS=mode==="trace"?TRACE_ROUNDS:DRAG_ROUNDS;
  BANNERS=mode==="trace"?TRACE_BANNERS:DRAG_BANNERS;
  initAudio();
  round=0;score=0;
  el("start-screen").style.display="none";
  el("main-ui").style.display="block";
  el("end-screen").style.display="none";
  el("round-banner").style.display="none";
  showUI(true);
  startRound();
}

function startRound(){
  order=shuffle([...Array(words.length).keys()]);
  idx=0;answered=false;
  el("round-label").textContent=ROUNDS[round].label+" — "+ROUNDS[round].name;
  el("feedback").textContent="";
  el("next-btn").style.visibility="hidden";
  buildProgress();loadQ();
}

const TOTAL_TRACE=words.length*TRACE_ROUNDS.length;
const TOTAL_DRAG=words.length*DRAG_ROUNDS.length;
function getTotal(){return gameMode==="trace"?TOTAL_TRACE:TOTAL_DRAG;}

function buildProgress(){
  const p=el("progress");p.innerHTML="";
  const total=getTotal();
  for(let i=0;i<total;i++){
    const d=document.createElement("div");
    d.className="pip"+(i<round*words.length?"done":i===round*words.length+idx?"current":"");
    d.id="pip"+i;p.appendChild(d);
  }
}
function updateProgress(){
  const total=getTotal();
  for(let i=0;i<total;i++){
    const e=el("pip"+i);if(!e)continue;
    const off=round*words.length;
    e.className="pip"+(i<off?"done":i===off+idx?"current":i<off+idx?"done":"");
  }
}

function loadQ(){
  answered=false;typedSoFar=[];currentSlot=0;draggedLetter=null;
  const w=words[order[idx]],r=ROUNDS[round];
  el("picture").textContent="";el("feedback").textContent="";el("next-btn").style.visibility="hidden";
  el("letters-area").style.display="none";el("trace-area").style.display="none";
  el("keyboard-area").style.display="none";el("word-display").style.display="none";
  updateProgress();
  if(r.mode==="trace"){
    el("trace-area").style.display="flex";
    buildTraceUI(r.upper?w.letter:w.letter.toLowerCase());
  } else if(r.mode==="drag"){
    el("word-display").style.display="flex";
    el("letters-area").style.display="flex";
    el("picture").textContent=w.pic;
    buildWordDisplayDrag(w,r);
    buildDragTiles(r.upper);
  } else {
    el("word-display").style.display="flex";
    el("keyboard-area").style.display="flex";
    el("picture").textContent=w.pic;
    buildWordDisplayType(w,r);
    buildKeyboard(r.upper);
  }
}

function buildTraceUI(letter){
  const ta=el("trace-area");ta.innerHTML="";
  const lbl=document.createElement("div");
  lbl.style.cssText="font-size:18px;font-weight:500;color:var(--color-text-secondary);margin-bottom:2px;";
  lbl.textContent="Trace the letter:";ta.appendChild(lbl);
  const wrap=document.createElement("div");wrap.className="trace-wrap";
  guideCanvas=document.createElement("canvas");guideCanvas.id="guide-canvas";guideCanvas.width=SIZE;guideCanvas.height=SIZE;
  traceCanvas=document.createElement("canvas");traceCanvas.id="trace-canvas";traceCanvas.width=SIZE;traceCanvas.height=SIZE;
  wrap.appendChild(guideCanvas);wrap.appendChild(traceCanvas);ta.appendChild(wrap);
  guideCtx=guideCanvas.getContext("2d");drawGuide(letter);
  traceCtx=traceCanvas.getContext("2d");traceCtx.strokeStyle="#1D4ED8";traceCtx.lineWidth=8;traceCtx.lineCap="round";traceCtx.lineJoin="round";
  const controls=document.createElement("div");controls.className="trace-controls";
  const clr=document.createElement("button");clr.className="trace-btn";clr.textContent="Clear ✕";
  clr.addEventListener("click",()=>{traceCtx.clearRect(0,0,SIZE,SIZE);el("feedback").textContent="";});
  const done=document.createElement("button");done.className="trace-btn";done.style.cssText="background:#E6F1FB;color:#185FA5;border-color:#378ADD;";done.textContent="Done ✓";
  done.addEventListener("click",()=>handleTraceDone(letter));
  controls.appendChild(clr);controls.appendChild(done);ta.appendChild(controls);
  function getPos(e,c){const r=c.getBoundingClientRect();const src=e.touches?e.touches[0]:e;return{x:(src.clientX-r.left)*(c.width/r.width),y:(src.clientY-r.top)*(c.height/r.height)};}
  traceCanvas.addEventListener("mousedown",e=>{drawing=true;traceCtx.beginPath();const p=getPos(e,traceCanvas);traceCtx.moveTo(p.x,p.y);});
  traceCanvas.addEventListener("mousemove",e=>{if(!drawing)return;const p=getPos(e,traceCanvas);traceCtx.lineTo(p.x,p.y);traceCtx.stroke();});
  traceCanvas.addEventListener("mouseup",()=>drawing=false);
  traceCanvas.addEventListener("touchstart",e=>{e.preventDefault();drawing=true;traceCtx.beginPath();const p=getPos(e,traceCanvas);traceCtx.moveTo(p.x,p.y);},{passive:false});
  traceCanvas.addEventListener("touchmove",e=>{e.preventDefault();if(!drawing)return;const p=getPos(e,traceCanvas);traceCtx.lineTo(p.x,p.y);traceCtx.stroke();},{passive:false});
  traceCanvas.addEventListener("touchend",()=>drawing=false);
}

function handleTraceDone(letter){
  if(answered)return;
  const result=scoreTracing(letter);
  if(result.reason==="not_enough"){el("feedback").textContent="Draw more of the letter! ✏️";playSfx("wrong");return;}
  if(!result.ok){el("feedback").textContent="Try to follow the dotted guide! ✏️";playSfx("wrong");return;}
  answered=true;score++;el("score-display").textContent="⭐ "+score;
  el("feedback").textContent="⭐ Great tracing!";playSfx("correct");
  setTimeout(()=>{el("next-btn").style.visibility="visible";},500);
}

function buildWordDisplayDrag(w,r){
  const wd=el("word-display");wd.innerHTML="";
  const dw=r.upper?w.word.toUpperCase():w.word;
  dw.split("").forEach((ch,i)=>{
    if(i===0){
      const dz=document.createElement("div");dz.className="drop-zone";dz.id="drop-zone";dz.textContent="_";
      dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("drag-over");});
      dz.addEventListener("dragleave",()=>dz.classList.remove("drag-over"));
      dz.addEventListener("drop",e=>{e.preventDefault();handleDrop(draggedLetter);});
      wd.appendChild(dz);
    } else {
      const lb=document.createElement("div");lb.className="letter-box";lb.textContent=ch;wd.appendChild(lb);
    }
  });
}

function buildDragTiles(upper){
  const area=el("letters-area");area.innerHTML="";
  const opts=shuffle(upper?["A","B","C","D"]:["a","b","c","d"]);
  opts.forEach(ch=>{
    const tile=document.createElement("div");tile.className="letter-tile";tile.textContent=ch;tile.draggable=true;tile.dataset.letter=ch;
    tile.addEventListener("dragstart",()=>{draggedLetter=ch;setTimeout(()=>tile.classList.add("dragging"),0);});
    tile.addEventListener("dragend",()=>tile.classList.remove("dragging"));
    tile.addEventListener("touchstart",e=>onTouchStart(e,tile,ch),{passive:false});
    tile.addEventListener("touchmove",onTouchMove,{passive:false});
    tile.addEventListener("touchend",e=>onTouchEnd(e,ch));
    area.appendChild(tile);
  });
}

function handleDrop(letter){
  if(answered||!letter)return;
  const dz=el("drop-zone");if(!dz)return;
  const w=words[order[idx]],r=ROUNDS[round];
  const correct=r.upper?w.letter:w.letter.toLowerCase();
  answered=true;dz.textContent=letter;dz.classList.remove("drag-over");
  document.querySelectorAll(".letter-tile").forEach(t=>{if(t.dataset.letter===letter)t.classList.add("used");});
  if(letter===correct){
    dz.classList.add("correct");el("feedback").textContent="⭐ Great job!";score++;
    el("score-display").textContent="⭐ "+score;playSfx("correct");
  } else {
    dz.classList.add("wrong");el("feedback").textContent='The answer is "'+correct+'"';playSfx("wrong");
  }
  setTimeout(()=>{el("next-btn").style.visibility="visible";},600);
}

function onTouchStart(e,tile,ch){
  e.preventDefault();touchTile=tile;
  const t=e.touches[0];
  touchClone=tile.cloneNode(true);
  touchClone.style.cssText="position:fixed;opacity:0.85;pointer-events:none;z-index:9999;width:64px;height:64px;font-size:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);color:var(--color-text-primary);";
  touchClone.style.left=(t.clientX-32)+"px";touchClone.style.top=(t.clientY-32)+"px";
  document.body.appendChild(touchClone);tile.classList.add("dragging");
}
function onTouchMove(e){
  e.preventDefault();if(!touchClone)return;
  const t=e.touches[0];touchClone.style.left=(t.clientX-32)+"px";touchClone.style.top=(t.clientY-32)+"px";
}
function onTouchEnd(e,ch){
  if(!touchClone)return;
  const t=e.changedTouches[0];const dz=el("drop-zone");
  if(dz){const r=dz.getBoundingClientRect();if(t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom)handleDrop(ch);}
  touchClone.remove();touchClone=null;if(touchTile){touchTile.classList.remove("dragging");touchTile=null;}
}

function buildWordDisplayType(w,r){
  const wd=el("word-display");wd.innerHTML="";
  const dw=r.upper?w.word.toUpperCase():w.word;
  dw.split("").forEach((ch,i)=>{
    const s=document.createElement("div");s.className="letter-slot"+(i===0?" active-slot":"");s.id="slot"+i;wd.appendChild(s);
  });
}
function buildKeyboard(upper){
  const ka=el("keyboard-area");ka.innerHTML="";
  (upper?ALL_UPPER:ALL_LOWER).forEach(ch=>{
    const btn=document.createElement("div");btn.className="key-btn";btn.textContent=ch;
    btn.addEventListener("click",()=>{playSfx("tap");handleKey(ch);});ka.appendChild(btn);
  });
  const del=document.createElement("div");del.className="key-btn del";del.textContent="⌫";
  del.addEventListener("click",handleDelete);ka.appendChild(del);
}
function handleKey(ch){
  if(answered)return;
  const w=words[order[idx]],r=ROUNDS[round];
  const target=r.upper?w.word.toUpperCase():w.word;
  if(currentSlot>=target.length)return;
  const slot=el("slot"+currentSlot);if(!slot)return;
  slot.textContent=ch;slot.classList.remove("active-slot");
  const ok=ch===target[currentSlot];slot.classList.add(ok?"filled-correct":"filled-wrong");
  typedSoFar.push({ch,correct:ok});currentSlot++;
  if(currentSlot<target.length){const nx=el("slot"+currentSlot);if(nx)nx.classList.add("active-slot");}
  if(currentSlot===target.length){
    answered=true;
    const all=typedSoFar.every(t=>t.correct);
    if(all){score++;el("score-display").textContent="⭐ "+score;el("feedback").textContent="⭐ Perfect spelling!";playSfx("correct");}
    else{el("feedback").textContent="Good try! Check the red letters.";playSfx("wrong");}
    setTimeout(()=>{el("next-btn").style.visibility="visible";},600);
  }
}
function handleDelete(){
  if(answered||currentSlot===0)return;
  currentSlot--;
  const slot=el("slot"+currentSlot);if(!slot)return;
  slot.textContent="";slot.className="letter-slot active-slot";typedSoFar.pop();
  const nx=el("slot"+(currentSlot+1));if(nx)nx.classList.remove("active-slot");
}

el("next-btn").addEventListener("click",()=>{
  idx++;
  if(idx>=words.length){round<ROUNDS.length-1?showBanner():showEnd();return;}
  loadQ();
});
function showBanner(){
  showUI(false);el("round-label").textContent="";
  const b=BANNERS[round];
  el("banner-emoji").textContent=b.emoji;el("banner-title").textContent=b.title;el("banner-sub").textContent=b.sub;
  el("round-banner").style.display="flex";playSfx("fanfare");
}
el("banner-btn").addEventListener("click",()=>{el("round-banner").style.display="none";round++;showUI(true);startRound();});
function showUI(v){
  ["word-card","feedback","next-btn"].forEach(id=>{el(id).style.display=v?(id==="word-card"?"flex":""):"none";});
  if(!v){el("trace-area").style.display="none";el("keyboard-area").style.display="none";el("letters-area").style.display="none";}
}
function showEnd(){
  showUI(false);el("round-label").textContent="";
  el("end-score").textContent="You got "+score+" out of "+getTotal()+" right!";
  el("end-screen").style.display="block";playSfx("fanfare");
}
el("pick-trace").addEventListener("click",()=>startGame("trace"));
el("pick-drag").addEventListener("click",()=>startGame("drag"));
el("play-again-btn").addEventListener("click",()=>{el("end-screen").style.display="none";startGame(gameMode);});
el("menu-btn").addEventListener("click",goToMenu);
el("back-btn").addEventListener("click",goToMenu);
el("mute-btn").addEventListener("click",toggleMute);
</script>
